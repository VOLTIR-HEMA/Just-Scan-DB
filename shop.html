<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسوق منتجاتنا</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.2.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8; --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-dim: #94a3b8; --border: #334155; --success: #22c55e;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
        }
        .wrapper {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }
        .header {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.5rem;
            transform: scaleX(-1);
        }
        .cart-icon-link {
            position: relative;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: red;
            color: #fff;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 2px solid var(--card-bg);
        }
        /* Product Card Styles from index.html */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 15px 0; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-align: center; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 120px; object-fit: cover; cursor: pointer; }
        .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-info h4 { margin: 0 0 5px 0; font-size: 0.95em; color: var(--text-main); flex-grow: 1; }
        .product-price { font-weight: bold; color: var(--success); margin-bottom: 10px; }
        .btn-secondary { width: 100%; padding: 8px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-weight: bold; font-size: 0.9em; cursor: pointer; transition: 0.2s; }
        .btn-secondary:hover { color: var(--primary); border-color: var(--primary); }
        .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9999; align-items: center; justify-content: center; }
        .image-viewer-content { max-width: 90%; max-height: 85%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .image-viewer-close { position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; font-size: 1em; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-btn">→</a>
        <h1 style="font-size: 1.2rem; margin: 0;">تسوق منتجاتنا</h1>
        <a href="cart.html" class="cart-icon-link" style="color: var(--text-main); text-decoration: none;">
            <span style="font-size: 1.5em;">🛒</span>
            <span class="cart-count" id="cart-count-badge">0</span>
        </a>
    </header>

    <main class="wrapper">
        <div style="margin-bottom: 20px; position: relative;">
            <input type="text" id="search-input" placeholder="🔎 ابحث عن منتج..." style="width: 100%; padding: 12px 15px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 1em;">
        </div>

        <div id="products-grid" class="product-grid">
            <p style="color: var(--text-dim); text-align: center; grid-column: 1 / -1;">جاري تحميل المنتجات...</p>
        </div>
        <p id="no-results" style="color: var(--text-dim); text-align: center; display: none;">لا توجد نتائج مطابقة لبحثك.</p>
    </main>

    <div id="customImageViewer" class="image-viewer-modal">
        <button class="image-viewer-close" onclick="closeImageViewer()">❌ إغلاق العرض</button>
        <img id="viewerTargetImage" class="image-viewer-content" src="" alt="صورة المنتج">
    </div>

    <script>
        const DB_URL = "https://my-assistant-7c330-default-rtdb.firebaseio.com/";
        let allProducts = {}; // لتخزين كل المنتجات مرة واحدة

        window.addEventListener('DOMContentLoaded', () => {
            // تحديث عداد السلة عند تحميل الصفحة
            updateCartCounter();
            loadStoreProducts();
        });

        async function loadStoreProducts() {
            const grid = document.getElementById('products-grid');
            try {
                const res = await fetch(`${DB_URL}/products.json`);
                const products = await res.json();
                grid.innerHTML = '';
                if (!products) {
                    grid.innerHTML = '<p style="color: var(--text-dim); text-align: center; grid-column: 1 / -1;">لا توجد منتجات في المتجر حالياً.</p>';
                    return;
                }
                Object.keys(products).forEach(id => {
                    const p = products[id];
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${p.image}" alt="${p.name}" onclick="openImageViewer('${p.image}')">
                        <div class="product-info">
                            <h4>${p.name}</h4>
                            <div>
                                <p class="product-price">${p.price} ج.م</p>
                                <button class="btn-secondary" onclick="addToCart('${id}', '${p.name}', ${p.price}, '${p.image}')">🛒 أضف للسلة</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Error loading products:", e);
                grid.innerHTML = '<p style="color: var(--text-dim); text-align: center; grid-column: 1 / -1;">حدث خطأ أثناء تحميل المنتجات.</p>';
            }
        }

        async function addToCart(id, name, price, image) {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) {
                return Swal.fire({ icon: 'error', title: 'خطأ', text: 'يرجى تسجيل الدخول أولاً لإضافة منتجات للسلة.', background: '#1e293b', color: '#f1f5f9' });
            }

            const cartItemRef = `${DB_URL}/carts/${phone}/${id}.json`;

            try {
                // تحقق مما إذا كان المنتج موجودًا بالفعل لزيادة الكمية
                const res = await fetch(cartItemRef);
                const existingItem = await res.json();

                let newItemData;
                if (existingItem) {
                    newItemData = { ...existingItem, quantity: existingItem.quantity + 1 };
                } else {
                    newItemData = { name, price: parseFloat(price), image, quantity: 1 };
                }

                // أرسل البيانات المحدثة إلى Firebase
                await fetch(cartItemRef, { method: 'PUT', body: JSON.stringify(newItemData) });

                updateCartCounter();
                Swal.fire({ icon: 'success', title: 'تمت الإضافة', text: `تمت إضافة "${name}" إلى السلة.`, toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, background: '#1e293b', color: '#f1f5f9' });

            } catch (e) {
                console.error("Error adding to cart:", e);
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'فشل إضافة المنتج للسلة.', background: '#1e293b', color: '#f1f5f9' });
            }
        }

        async function updateCartCounter() {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) return; // لا تفعل شيئًا إذا لم يكن المستخدم مسجلاً

            const res = await fetch(`${DB_URL}/carts/${phone}.json`);
            const cart = await res.json();
            const count = cart ? Object.keys(cart).length : 0;

            const counterBadge = document.getElementById('cart-count-badge');
            counterBadge.innerText = count;
            counterBadge.style.display = count > 0 ? 'flex' : 'none';
        }

        function openImageViewer(base64Src) {
            if(!base64Src) return;
            document.getElementById('viewerTargetImage').src = base64Src;
            document.getElementById('customImageViewer').style.display = 'flex';
        }
        function closeImageViewer() {
            document.getElementById('customImageViewer').style.display = 'none';
            document.getElementById('viewerTargetImage').src = '';
        }
    </script>

</body>
</html>
