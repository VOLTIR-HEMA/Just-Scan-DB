<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عربة التسوق</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8; --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-dim: #94a3b8; --border: #334155; --success: #22c55e; --danger: #ef4444;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
        }
        .wrapper {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }
        .header {
            background-color: var(--card-bg);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.5rem;
            transform: scaleX(-1);
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .cart-item img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-details p {
            margin: 0;
        }
        .cart-item-name {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .cart-item-price {
            font-size: 0.9em;
            color: var(--success);
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .quantity-btn {
            background: #334155;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            line-height: 28px;
            text-align: center;
        }
        .quantity-value {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        .remove-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 1.5em;
            cursor: pointer;
        }
        .cart-summary {
            position: sticky;
            bottom: 0;
            background: var(--card-bg);
            padding: 15px;
            border-top: 2px solid var(--primary);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-price {
            font-size: 1.2em;
            font-weight: bold;
        }
        .checkout-btn {
            padding: 12px 25px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: var(--bg-dark);
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="shop.html" class="back-btn">→</a>
        <h1 style="font-size: 1.2rem; margin: 0;">عربة التسوق</h1>
        <div></div> <!-- for spacing -->
    </header>

    <main class="wrapper" id="cart-items-container">
        <!-- Cart items will be loaded here -->
    </main>

    <div id="cart-summary" class="cart-summary" style="display: none;">
        <div>
            <span style="color: var(--text-dim);">الإجمالي:</span>
            <span id="total-price" class="total-price">0 ج.م</span>
        </div>
        <button class="checkout-btn" onclick="submitOrder()">✔ إتمام الطلب</button>
    </div>

    <script>
        const DB_URL = "https://my-assistant-7c330-default-rtdb.firebaseio.com/";

        window.addEventListener('DOMContentLoaded', renderCart);

        async function getCartFromFirebase() {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) return null;
            try {
                const res = await fetch(`${DB_URL}/carts/${phone}.json`);
                return await res.json();
            } catch (e) {
                console.error("Failed to fetch cart:", e);
                return null;
            }
        }

        async function renderCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary');
            container.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 50px 0;">جاري تحميل السلة...</p>';
            let totalPrice = 0;

            const cart = await getCartFromFirebase();

            container.innerHTML = ''; // Clear loader

            if (Object.keys(cart).length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim); text-align: center; padding: 50px 0;">🛒 عربة التسوق فارغة حالياً.</p>';
                summary.style.display = 'none';
                return;
            }

            summary.style.display = 'flex';

            for (const id in cart) {
                const item = cart[id];
                totalPrice += item.price * item.quantity;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-details">
                        <p class="cart-item-name">${item.name}</p>
                        <p class="cart-item-price">${item.price} ج.م</p>
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="changeQuantity('${id}', ${item.quantity - 1})">-</button>
                            <span class="quantity-value">${item.quantity}</span>
                            <button class="quantity-btn" onclick="changeQuantity('${id}', ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart('${id}')">&times;</button>
                `;
                container.appendChild(itemDiv);
            }

            document.getElementById('total-price').innerText = `${totalPrice.toFixed(2)} ج.م`;
        }

        async function changeQuantity(id, newQuantity) {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) return;

            if (newQuantity <= 0) {
                await removeFromCart(id);
            } else {
                const itemRef = `${DB_URL}/carts/${phone}/${id}/quantity.json`;
                await fetch(itemRef, { method: 'PUT', body: JSON.stringify(newQuantity) });
            }
            renderCart();
        }

        async function removeFromCart(id) {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) return;

            const itemRef = `${DB_URL}/carts/${phone}/${id}.json`;
            await fetch(itemRef, { method: 'DELETE' });
            renderCart();
        }

        async function submitOrder() {
            const phone = localStorage.getItem('customer_phone');
            if (!phone) {
                return Swal.fire({ icon: 'error', title: 'خطأ', text: 'لا يمكن إتمام الطلب. يرجى تسجيل الدخول أولاً.', background: '#1e293b', color: '#f1f5f9' });
            }

            const cart = await getCartFromFirebase();

            if (Object.keys(cart).length === 0) {
                return Swal.fire({ icon: 'warning', title: 'عربة فارغة', text: 'لا يمكنك إرسال طلب بعربة فارغة.', background: '#1e293b', color: '#f1f5f9' });
            }

            const totalPrice = Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);

            const orderData = {
                phone: phone,
                items: cart,
                totalPrice: totalPrice.toFixed(2),
                status: "قيد المراجعة",
                timestamp: Date.now()
            };

            try {
                const res = await fetch(`${DB_URL}/cart_orders.json`, {
                    method: 'POST',
                    body: JSON.stringify(orderData)
                });

                if (res.ok) {
                    // حذف السلة من Firebase بعد إتمام الطلب
                    const cartRef = `${DB_URL}/carts/${phone}.json`;
                    await fetch(cartRef, { method: 'DELETE' });

                    Swal.fire({
                        icon: 'success',
                        title: 'تم إرسال الطلب بنجاح!',
                        text: 'سيتم مراجعة طلبك والتواصل معك قريباً. شكراً لتسوقك معنا.',
                        background: '#1e293b',
                        color: '#f1f5f9',
                        confirmButtonColor: '#38bdf8'
                    }).then(() => { // Gemini Suggestion: Use relative path for better navigation
                        window.location.href = 'index.html'; // العودة للصفحة الرئيسية
                    });

                    renderCart(); // إعادة عرض السلة الفارغة
                } else { throw new Error('Failed to submit order'); }
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى.', background: '#1e293b', color: '#f1f5f9' });
            }
        }
    </script>

</body>
</html>
