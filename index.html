<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة عملاء صيدلية د. إبراهيم الرقمية</title>
    <style>
        :root {
            --primary: #38bdf8;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
            --gold: #fbbf24;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background-color: #000; color: var(--text-main); margin: 0; padding: 0; direction: rtl; }
        .wrapper { max-width: 500px; margin: auto; padding: 15px; }
        
        /* Login Screen style */
        .login-box { background: var(--card-bg); border: 1px solid var(--border); padding: 30px 20px; border-radius: 16px; text-align: center; margin-top: 50px; }
        .input-phone { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: #fff; font-size: 1.2em; text-align: center; outline: none; margin-bottom: 20px; }
        .input-phone:focus { border-color: var(--primary); }
        
        .btn-action { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; color: var(--bg-dark); font-weight: bold; font-size: 1.1em; cursor: pointer; }
        
        /* Main Portal UI (Hidden before login) */
        #portal-ui { display: none; }
        
        .loyalty-card { background: linear-gradient(135deg, #1e3a8a, #0f172a); border: 2px solid var(--primary); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.2); margin-bottom: 25px; }
        .card-brand { font-size: 1.2em; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
        .card-holder { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; }
        .card-phone { font-size: 0.9em; color: var(--text-dim); }
        .points-display { text-align: left; margin-top: 10px; }
        .points-num { font-size: 2.2em; font-weight: bold; color: var(--gold); }
        .cashback-val { font-size: 1em; color: #22c55e; margin-top: 5px; }

        .offer-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; border-right: 5px solid var(--primary); }
        .offer-card h3 { margin: 0 0 5px 0; font-size: 1.1em; color: var(--primary); }
        .offer-card p { margin: 0; font-size: 0.9em; color: var(--text-dim); }
    </style>
</head>
<body>

<div class="wrapper">
    
    <div id="login-ui" class="login-box">
        <h2 style="color: var(--primary); margin-top: 0;">مرحباً بك في صيدليتك ✨</h2>
        <p style="color: var(--text-dim); font-size: 0.95em; margin-bottom: 25px;">ادخل رقم الموبايل المسجل لدينا لمتابعة نقاطك وعروضك الحصرية</p>
        <input type="tel" id="user-phone-input" class="input-phone" placeholder="01xxxxxxxxx">
        <button class="btn-action" onclick="customerLoginProcess()">🎯 دخول واستعراض الحساب</button>
    </div>

    <div id="portal-ui">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="font-weight: bold; color: var(--primary);">حساب الولاء الرقمي 💳</span>
            <button onclick="location.reload()" style="background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:0.9em;">🚪 خروج</button>
        </div>

        <div class="loyalty-card">
            <div class="card-brand">صيدلية د. إبراهيم الذكية</div>
            <div class="card-holder" id="ui-holder-name">--- ---</div>
            <div class="card-phone" id="ui-holder-phone">01xxxxxxxxx</div>
            <div class="points-display">
                <span>رصيد النقاط الحالية:</span>
                <div class="points-num" id="ui-points-val">0</div>
                <div class="cashback-val" id="ui-cashback-val">💸 الخصم المالي المتاح لك: 0 ج.م</div>
            </div>
        </div>

        <h2 style="font-size: 1.2em; border-right: 3px solid var(--primary); padding-right: 8px; color: var(--primary); margin-bottom: 15px;">📢 عروض حصرية مخصصة لك اليوم</h2>
        <div id="offers-container">
            <p style="color: var(--text-dim); text-align: center;">جاري تصفية العروض المخصصة لك...</p>
        </div>
    </div>

</div>

<script>
    // ⚠️ تأكد أن هذا الرابط مطابق تماماً للرابط في صفحة الـ Admin الجديدة
    const DB_URL = "https://my-assistant-7c330-default-rtdb.firebaseio.com/";

    async function customerLoginProcess() {
        const phone = document.getElementById('user-phone-input').value.trim();
        if(!phone) return alert("برجاء إدخال رقم الموبايل أولاً.");

        try {
            // جلب بيانات العميل المحدّد برقم موبايله
            const res = await fetch(`${DB_URL}/customers/${phone}.json`);
            const user = await res.json();

            if(!user) {
                return alert("❌ عذراً، هذا الرقم غير مسجل في نظام الولاء لدينا. برجاء الطلب من الصيدلي تسجيلك أولاً.");
            }

            // عرض البيانات في الكارت الديجيتال
            document.getElementById('ui-holder-name').innerText = user.name;
            document.getElementById('ui-holder-phone').innerText = phone;
            
            const points = user.points || 0;
            document.getElementById('ui-points-val').innerText = points;
            
            // معادلة حساب الخصم: كل 10 نقاط تساوي 1 جنيه خصم (تقدر تغير النسبة دي براحتك)
            const cashBack = Math.floor(points / 10);
            document.getElementById('ui-cashback-val').innerText = `💸 الخصم المالي المتاح لك: ${cashBack} ج.م`;

            // إخفاء شاشة الدخول وإظهار شاشة البوابة والبطاقة
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('portal-ui').style.display = 'block';

            // جلب وفلترة العروض الذكية بناءً على فئة العميل (رجال / نساء)
            loadAndFilterOffers(user.gender);

        } catch(e) {
            alert("خطأ في الاتصال بالشبكة: " + e.message);
        }
    }

    async function loadAndFilterOffers(customerGender) {
        const container = document.getElementById('offers-container');
        container.innerHTML = '';

        try {
            const res = await fetch(`${DB_URL}/offers.json`);
            const offers = await res.json();

            if(!offers) {
                container.innerHTML = '<p style="color: var(--text-dim); text-align: center;">لا توجد عروض منشورة حالياً.</p>';
                return;
            }

            let hasOffers = false;

            Object.keys(offers).forEach(id => {
                const offer = offers[id];
                
                // 🧠 الفلترة والذكاء التجاري: العرض يظهر لو مستهدف "الكل" أو متطابق تماماً مع جنس العميل
                if(offer.target === "الكل" || offer.target === customerGender) {
                    hasOffers = true;
                    const card = document.createElement('div');
                    card.className = 'offer-card';
                    card.innerHTML = `
                        <h3>${offer.title}</h3>
                        <p>${offer.desc}</p>
                    `;
                    container.appendChild(card);
                }
            });

            if(!hasOffers) {
                container.innerHTML = '<p style="color: var(--text-dim); text-align: center;">لا توجد عروض متوفرة لفئتك حالياً.</p>';
            }

        } catch(e) {
            container.innerHTML = '<p style="color: var(--text-dim); text-align: center;">حدث خطأ أثناء تحميل العروض.</p>';
        }
    }
</script>
</body>
</html>
